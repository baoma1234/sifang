<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title><{:C("WEB_TITLE")}></title>
<link rel="stylesheet" href="/Public/Front/js/plugins/layui/css/layui.css">
<link href="/Public/Front/css/bootstrap.min.css" rel="stylesheet">
<style>
body { padding: 20px; }
.layui-form-label { width: 90px; }
</style>
</head>
<body>
<div class="layui-form">
    <input type="hidden" name="aid" value="<{$aid}>">
    <div class="layui-form-item">
        <label class="layui-form-label">账号</label>
        <div class="layui-input-block" style="line-height: 38px;"><{$account.title}></div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">用户名</label>
        <div class="layui-input-block">
            <input type="text" class="layui-input" name="username" placeholder="登录用户名">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">密码</label>
        <div class="layui-input-block">
            <input type="password" class="layui-input" name="password" placeholder="登录密码">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">验证码</label>
        <div class="layui-input-inline" style="width: 140px;">
            <input type="text" class="layui-input" name="captcha" placeholder="验证码">
        </div>
        <div class="layui-input-inline" style="width: 140px;">
            <img id="captchaImg" src="<{:U('Admin/Jiaigou/getCaptcha', array('aid'=>$aid))}>" style="height:38px;border:1px solid #ddd;cursor:pointer;" onclick="refreshCaptcha()">
        </div>
    </div>
    <div class="layui-form-item">
        <div class="layui-input-block">
            <button class="layui-btn" id="doLogin">登录</button>
        </div>
    </div>
</div>
<script src="/Public/Front/js/jquery.min.js"></script>
<script src="/Public/Front/js/plugins/layui/layui.js" charset="utf-8"></script>
<script>
function refreshCaptcha(){
    $('#captchaImg').attr('src', "<{:U('Admin/Jiaigou/getCaptcha', array('aid'=>$aid))}>?t=" + Math.random());
}
layui.use(['layer'], function(){
  var layer = layui.layer;
  $('#doLogin').on('click', function(){
      $.ajax({
          url: "<{:U('Admin/Jiaigou/loginAccount')}>",
          type: 'post',
          data: {
              aid: $('input[name=aid]').val(),
              username: $('input[name=username]').val(),
              password: $('input[name=password]').val(),
              captcha: $('input[name=captcha]').val()
          },
          success: function(res){
              if(res.status){
                  layer.msg(res.msg || '登录成功', {icon:1,time:1000}, function(){
                      parent.location.reload();
                      var index = parent.layer.getFrameIndex(window.name);
                      parent.layer.close(index);
                  });
              } else {
                  layer.msg(res.msg || '登录失败', {icon:2});
                  refreshCaptcha();
              }
          }
      });
      return false;
  });
});
</script>
</body>
</html>
