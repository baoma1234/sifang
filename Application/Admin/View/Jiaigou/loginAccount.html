<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="renderer" content="webkit">
<title><{:C("WEB_TITLE")}></title>
<link rel="shortcut icon" href="favicon.ico">
<link href="/Public/Front/css/bootstrap.min.css" rel="stylesheet">
<link href="/Public/Front/css/font-awesome.min.css" rel="stylesheet">
<link href="/Public/Front/css/animate.css" rel="stylesheet">
<link href="/Public/Front/css/style.css" rel="stylesheet">
<link rel="stylesheet" href="/Public/Front/js/plugins/layui/css/layui.css">
<style>
body { padding: 20px; background:#f8f9fb; }
.layui-form-label { width: 90px; }
.panel { box-shadow: 0 6px 20px rgba(0,0,0,.06); border:0; }
</style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <div class="col-sm-12">
            <div class="panel panel-default">
                <div class="panel-heading">
                    <h3 class="panel-title">久爱购账号登录 - <strong><{$account.title}></strong></h3>
                </div>
                <div class="panel-body">
                    <form class="layui-form" id="loginForm">
                        <input type="hidden" name="aid" value="<{$aid}>">
                        <div class="form-group">
                            <label>商户号</label>
                            <input type="text" class="form-control" name="username" value="<{$account.mch_id}>" placeholder="商户号">
                        </div>
                        <div class="form-group">
                            <label>商户密码</label>
                            <input type="password" class="form-control" name="password" value="<{$account.signkey}>" placeholder="商户密码">
                        </div>
                        <div class="form-group">
                            <label>验证码</label>
                            <div class="row">
                                <div class="col-xs-6">
                                    <input type="text" class="form-control" name="captcha" placeholder="验证码">
                                </div>
                                <div class="col-xs-6">
                                    <img id="captchaImg" src="<{:U('Admin/Jiaigou/getCaptcha', array('aid'=>$aid))}>" style="height:34px;border:1px solid #ddd;cursor:pointer;" onclick="refreshCaptcha()">
                                </div>
                            </div>
                        </div>
                        <button type="button" class="btn btn-primary btn-block" id="doLogin">登录</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="/Public/Front/js/jquery.min.js"></script>
<script src="/Public/Front/js/plugins/layui/layui.js" charset="utf-8"></script>
<script>
function refreshCaptcha(){
    $('#captchaImg').attr('src', "<{:U('Admin/Jiaigou/getCaptcha', array('aid'=>$aid))}>?t=" + Math.random());
}
layui.use(['layer'], function(){
  var layer = layui.layer;
  $('#doLogin').on('click', function(){
      $.ajax({
          url: "<{:U('Admin/Jiaigou/loginAccount')}>",
          type: 'post',
          dataType: 'json',
          data: {
              aid: $('input[name=aid]').val(),
              username: $('input[name=username]').val(),
              password: $('input[name=password]').val(),
              captcha: $('input[name=captcha]').val()
          },
          success: function(res){
              if(res.status){
                  layer.msg(res.msg || '登录成功', {icon:1,time:1000}, function(){
                      parent.location.reload();
                      var index = parent.layer.getFrameIndex(window.name);
                      parent.layer.close(index);
                  });
              } else {
                  layer.msg(res.msg || '登录失败', {icon:2});
                  refreshCaptcha();
              }
          },
          error: function(){
              layer.msg('请求失败，请检查接口', {icon:2});
          }
      });
      return false;
  });
});
</script>
</body>
</html>
