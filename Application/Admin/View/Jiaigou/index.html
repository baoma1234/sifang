<include file="Public/header"/>
<include file="Public/top"/>
<include file="Public/left-nav"/>
<style>
.jg-card{background:#fff;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.06);padding:16px;margin-bottom:16px;}
.jg-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px;}
.jg-filter{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.jg-table td,.jg-table th{vertical-align:middle!important;}
.jg-search{min-width:240px;}
.jg-page{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;}
.jg-page .pagination{margin:0;}
</style>
<div class="content-wrapper">
    <section class="content-header">
        <h1>久爱购 账号管理</h1>
    </section>

    <section class="content">
        <div class="jg-card">
            <div class="jg-title">
                <h4 style="margin:0;">账号列表 <small class="text-muted jg-refresh-status">自动检测中</small></h4>
                <div class="jg-filter">
                    <button type="button" class="btn btn-success" onclick="refreshCookieStatus()">立即检测</button>
                    <button type="button" class="btn btn-primary" onclick="openJg('<{:U('Admin/Jiaigou/editAccount', array('aid'=>0))}>')">添加账号</button>
                    <form method="get" action="" class="form-inline" style="margin:0;">
                        <input type="text" name="keyword" value="<{$keyword}>" class="form-control jg-search" placeholder="搜索账号名称 / 商户号">
                        <select name="channel_id" class="form-control" style="margin-left:8px;" onchange="this.form.submit()">
                            <option value="0">全部通道</option>
                            <volist name="channels" id="c">
                                <option value="<{$c.id}>" <if condition="$channel_id eq $c['id']">selected</if>><{$c.title}></option>
                            </volist>
                        </select>
                        <input type="hidden" name="rows" value="<{$rows}>">
                        <button type="submit" class="btn btn-primary" style="margin-left:8px;">搜索</button>
                    </form>
                </div>
            </div>
            <div class="table-responsive">
                <table class="table table-hover table-bordered jg-table">
                    <thead>
                    <tr>
                        <th style="width:70px;">ID</th>
                        <th>账号名称</th>
                        <th>所属通道</th>
                        <th>商户号</th>
                        <th>Cookie状态</th>
                        <th>最后检测时间</th>
                        <th style="width:360px;">操作</th>
                    </tr>
                    </thead>
                    <tbody>
                    <volist name="accounts" id="p">
                        <tr>
                            <td><{$p.id}></td>
                            <td><strong><{$p.title}></strong></td>
                            <td><{$p.channel_title}></td>
                            <td><{$p.mch_id}></td>
                            <td>
                                <span class="label <if condition="$p['cookie_status'] eq 1">label-success<else/>label-default</if>"><if condition="$p['cookie_status'] eq 1">已登录<else/>未登录</if></span>
                            </td>
                            <td><{$p.cookie_updated_text}></td>
                            <td>
                                <button class="btn btn-warning btn-sm" onclick="openJg('<{:U('Admin/Jiaigou/loginAccount', array('aid'=>$p[id]))}>')">登录</button>
                                <button class="btn btn-info btn-sm" onclick="openJg('<{:U('Admin/Jiaigou/editAccount', array('aid'=>$p[id]))}>')">编辑</button>
                                <button class="btn btn-success btn-sm" onclick="checkOne(<{$p.id}>)">立即检测</button>
                            </td>
                        </tr>
                    </volist>
                    </tbody>
                </table>
            </div>
            <div class="jg-page">
                <div>
                    <form method="get" action="" class="form-inline" style="margin:0;">
                        <input type="hidden" name="keyword" value="<{$keyword}>">
                        <input type="hidden" name="channel_id" value="<{$channel_id}>">
                        <select name="rows" class="form-control" onchange="this.form.submit()">
                            <option value="15" <if condition="$rows eq 15">selected</if>>15条/页</option>
                            <option value="30" <if condition="$rows eq 30">selected</if>>30条/页</option>
                            <option value="50" <if condition="$rows eq 50">selected</if>>50条/页</option>
                            <option value="100" <if condition="$rows eq 100">selected</if>>100条/页</option>
                        </select>
                    </form>
                </div>
                <div><{$page}></div>
            </div>
        </div>
    </section>
</div>
<include file="Public/footer"/>
<script>
function openJg(url){
    layer.open({
        type: 2,
        title: '账号操作',
        area: ['620px', '520px'],
        shadeClose: true,
        content: url
    });
}

function refreshCookieStatus(){
    $('.jg-refresh-status').text('检测中...');
    $.ajax({
        url: "<{:U('Admin/Jiaigou/checkCookieStatus')}>",
        type: 'post',
        dataType: 'json',
        data: {},
        success: function(res){
            $('.jg-refresh-status').text(res.status ? '已检测' : '检测失败');
            if(res.status){
                window.location.reload();
            }
        },
        error: function(){
            $('.jg-refresh-status').text('检测失败');
        }
    });
}

function checkOne(aid){
    $.ajax({
        url: "<{:U('Admin/Jiaigou/checkCookieStatus')}>",
        type: 'post',
        dataType: 'json',
        data: {aid: aid},
        success: function(res){
            if(res.status){
                layer.msg('检测完成', {icon:1});
                window.location.reload();
            }else{
                layer.msg(res.msg || '检测失败', {icon:2});
            }
        },
        error: function(){
            layer.msg('检测失败', {icon:2});
        }
    });
}

setInterval(function(){
    refreshCookieStatus();
}, 300000);
</script>
