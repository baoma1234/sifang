<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="renderer" content="webkit">
<title><{:C("WEB_TITLE")}></title>
<link rel="shortcut icon" href="favicon.ico">
<link href="/Public/Front/css/bootstrap.min.css" rel="stylesheet">
<link href="/Public/Front/css/font-awesome.min.css" rel="stylesheet">
<link href="/Public/Front/css/animate.css" rel="stylesheet">
<link href="/Public/Front/css/style.css" rel="stylesheet">
<link rel="stylesheet" href="/Public/Front/js/plugins/layui/css/layui.css">
<style>
body{padding:16px;background:#f8f9fb;}
.panel{border:0;box-shadow:0 8px 24px rgba(0,0,0,.06);}
.form-group label{font-weight:normal;}
</style>
</head>
<body>
<div class="container-fluid">
    <div class="panel panel-default">
        <div class="panel-heading"><strong>编辑账号 - <{$account.title}></strong></div>
        <div class="panel-body">
            <form class="form-horizontal" id="editForm">
                <input type="hidden" name="aid" value="<{$aid}>">
                <input type="hidden" name="data[id]" value="<{$account.id}>">
                <div class="form-group">
                    <label class="col-sm-2 control-label">通道</label>
                    <div class="col-sm-8">
                        <select name="data[channel_id]" class="form-control">
                            <volist name="channels" id="c">
                                <option value="<{$c.id}>" <if condition="$account['channel_id'] eq $c['id']">selected</if>><{$c.title}> (<{$c.code}>)</option>
                            </volist>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label class="col-sm-2 control-label">账号名称</label>
                    <div class="col-sm-8">
                        <input type="text" name="data[title]" class="form-control" value="<{$account.title}>">
                    </div>
                </div>
                <div class="form-group">
                    <label class="col-sm-2 control-label">商户号</label>
                    <div class="col-sm-8">
                        <input type="text" name="data[mch_id]" class="form-control" value="<{$account.mch_id}>">
                    </div>
                </div>
                <div class="form-group">
                    <label class="col-sm-2 control-label">商户密码</label>
                    <div class="col-sm-8">
                        <input type="text" name="data[signkey]" class="form-control" value="<{$account.signkey}>">
                    </div>
                </div>
                <div class="form-group">
                    <label class="col-sm-2 control-label">权重</label>
                    <div class="col-sm-8">
                        <input type="number" name="data[weight]" class="form-control" value="<{$account.weight|default=1}>">
                    </div>
                </div>
                <div class="form-group">
                    <label class="col-sm-2 control-label">状态</label>
                    <div class="col-sm-8">
                        <select name="data[status]" class="form-control">
                            <option value="1" <if condition="$account['status'] eq 1">selected</if>>开启</option>
                            <option value="0" <if condition="$account['status'] eq 0">selected</if>>关闭</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <div class="col-sm-offset-2 col-sm-8">
                        <button type="button" class="btn btn-primary" id="saveBtn">保存</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="/Public/Front/js/jquery.min.js"></script>
<script src="/Public/Front/js/plugins/layui/layui.js" charset="utf-8"></script>
<script>
layui.use(['layer'], function(){
    var layer = layui.layer;
    $('#saveBtn').on('click', function(){
        $.ajax({
            url: "<{:U('Admin/Jiaigou/saveAccount')}>",
            type: 'post',
            dataType: 'json',
            data: $('#editForm').serialize(),
            success: function(res){
                if(res.status){
                    layer.msg(res.msg || '保存成功', {icon:1,time:1000}, function(){
                        parent.location.reload();
                        var index = parent.layer.getFrameIndex(window.name);
                        parent.layer.close(index);
                    });
                } else {
                    layer.msg(res.msg || '保存失败', {icon:2});
                }
            }
        });
    });
});
</script>
</body>
</html>
