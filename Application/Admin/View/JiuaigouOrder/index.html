<div class="content-wrapper">

            <div class="box-body">
                <form method="get" class="form-inline" style="margin-bottom:15px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;">
                    <input type="hidden" name="m" value="Admin">
                    <input type="hidden" name="c" value="JiuaigouOrder">
                    <input type="hidden" name="a" value="index">
                    <input type="text" name="order_no" class="form-control" style="width:180px;" placeholder="订单号" value="<{$order_no}>">
                    <input type="text" name="tran_no" class="form-control" style="width:180px;" placeholder="微信/支付宝/银行订单号" value="<{$tran_no}>">
                    <input type="text" name="customer_phone" class="form-control" style="width:160px;" placeholder="客户手机号" value="<{$customer_phone}>">

                    <select name="pay_status" class="form-control" style="width:140px;">
                        <option value="">全部支付状态</option>

                        <th>手续费</th>

                    <tbody>
                    <volist name="list" id="vo">
                        <tr>
                            <td><a href="javascript:;" class="copy-text" data-text="<{$vo.remote_order_no}>"><{$vo.remote_order_no}></a></td>
                            <td><a href="javascript:;" class="copy-text" data-text="<{$vo.tran_no}>"><{$vo.tran_no}></a></td>
                            <td><{$vo.customer_phone}></td>
                            <td><{$vo.device_sn}></td>
                            <td><{$vo.amount}></td>
                            <td><{$vo.pay_amount}></td>
                            <td><{$vo.fee_amt}></td>
                            <td><{$vo.num}></td>
                            <td><?php echo !empty($vo['pay_type_text']) ? $vo['pay_type_text'] : '-'; ?></td>
                            <td><?php echo !empty($vo['pay_time']) ? (is_numeric($vo['pay_time']) ? date('Y-m-d H:i:s', intval($vo['pay_time'])) : date('Y-m-d H:i:s', strtotime($vo['pay_time']))) : '-'; ?></td>
                            <td><?php
                                $payStatusColor = '#fa8c16';
                                if (isset($vo['pay_status']) && $vo['pay_status'] === 'success') {
                                    $payStatusColor = '#52c41a';
                                } elseif (isset($vo['pay_status']) && $vo['pay_status'] === 'fail') {
                                    $payStatusColor = '#ff4d4f';
                                } elseif (isset($vo['pay_status']) && $vo['pay_status'] === 'timeoutClose') {
                                    $payStatusColor = '#999999';
                                }
                                ?>
                                <span style="color:<?php echo $payStatusColor; ?>;"><?php echo !empty($vo['pay_status_text']) ? $vo['pay_status_text'] : '-'; ?></span>
                            </td>
                            <td><?php
                                $orderStatusColor = '#1890ff';
                                if (isset($vo['status']) && $vo['status'] === 'success') {
                                    $orderStatusColor = '#52c41a';
                                } elseif (isset($vo['status']) && $vo['status'] === 'fail') {
                                    $orderStatusColor = '#ff4d4f';
                                } elseif (isset($vo['status']) && $vo['status'] === 'timeoutClose') {
                                    $orderStatusColor = '#999999';
                                }
                                ?>
                                <span style="color:<?php echo $orderStatusColor; ?>;"><?php echo !empty($vo['status_text']) ? $vo['status_text'] : '-'; ?></span>
                            </td>
                            <td style="white-space:normal;word-break:break-all;max-width:420px;line-height:1.6;"><?php echo !empty($vo['items_text']) ? $vo['items_text'] : '-'; ?></td>
                            <td><?php echo !empty($vo['create_time']) ? (is_numeric($vo['create_time']) ? date('Y-m-d H:i:s', intval($vo['create_time'])) : date('Y-m-d H:i:s', strtotime($vo['create_time']))) : '-'; ?></td>
                            <td><?php echo !empty($vo['success_time']) ? (is_numeric($vo['success_time']) ? date('Y-m-d H:i:s', intval($vo['success_time'])) : date('Y-m-d H:i:s', strtotime($vo['success_time']))) : '-'; ?></td>
                            <td><?php echo !empty($vo['remark']) ? $vo['remark'] : '-'; ?></td>
                        </tr>
                    </volist>
                    </tbody>
                </table>

                <div class="page"><{$page}></div>
            </div>
        </div>
    </section>
</div>
<include file="Public/footer"/>
<script>
$(document).on('click', '.copy-text', function () {
    var text = $(this).data('text');
    if (!text) return;
    var tempInput = $('<input>');
    $('body').append(tempInput);
    tempInput.val(text).select();
    document.execCommand('copy');
    tempInput.remove();
    layer.msg('已复制: ' + text);
});
</script>
